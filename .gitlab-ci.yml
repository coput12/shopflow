# GitLab CI/CD — реализация того самого пайплайна из резюме.
# Запускается на раннере с Docker executor.
stages:
  - test
  - build
  - deploy

variables:
  IMAGE_REGISTRY: ${CI_REGISTRY}
  IMAGE_ORG: ${CI_PROJECT_PATH}

.test:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir -r app/$SERVICE/requirements.txt
  script:
    - cd app/$SERVICE && pytest -v

test-products:
  extends: .test
  variables: { SERVICE: products }
test-orders:
  extends: .test
  variables: { SERVICE: orders }

.build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_REGISTRY/$IMAGE_ORG/shopflow-$SERVICE:$CI_COMMIT_SHA" app/$SERVICE
    - docker push "$IMAGE_REGISTRY/$IMAGE_ORG/shopflow-$SERVICE:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-compose:
  stage: deploy
  image: alpine:3
  before_script:
    - apk add --no-cache openssh-client docker-cli-compose
  script:
    - |
      ssh -o StrictHostKeyChecking=no -i "$ID_RSA" "$DEPLOY_USER@$DEPLOY_HOST" \
        "cd /opt/shopflow && \
         git pull --ff-only && \
         IMAGE_TAG=$CI_COMMIT_SHA docker compose up -d --remove-orphans"
  environment:
    name: production
  only:
    - main
  when: manual