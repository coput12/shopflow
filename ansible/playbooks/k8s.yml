---
# Разворот K8s через k3s (лёгкий дистрибутив, идеален для single-node кластера).
# После запуска: kubectl get nodes на самой VM.
- name: Install k3s Kubernetes cluster
  hosts: shopflow
  become: true
  gather_facts: true

  tasks:
    - name: Install k3s
      shell: |
        curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_EXEC: "--disable traefik"
        K3S_KUBECONFIG_MODE: "644"

    - name: Wait for k3s to be ready
      shell: k3s kubectl get nodes
      register: nodes
      until: nodes.rc == 0 and " Ready " in nodes.stdout
      retries: 30
      delay: 3

    - name: Install Helm
      get_url:
        url: "https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz"
        dest: /tmp/helm.tgz
      register: helm_download

    - name: Extract Helm
      unarchive:
        src: /tmp/helm.tgz
        dest: /tmp
        remote_src: true

    - name: Install Helm binary
      copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        mode: "0755"

    - name: Install NGINX Ingress
      shell: helm upgrade --install ingress-nginx ingress-nginx --repo https://kubernetes.github.io/ingress-nginx --namespace ingress-nginx --create-namespace

    - name: Add Prometheus-community repo
      shell: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts && helm repo update