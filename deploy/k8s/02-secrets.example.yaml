# Пример Secret. В реальном проекте используй sealed-secrets / external-secrets / SOPS.
# Скопируй в k8s/secrets/*.yaml, заполни base64 и НЕ коммить в git.
# Получить base64: echo -n "value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: shopflow
type: Opaque
stringData:
  POSTGRES_USER: shopflow
  POSTGRES_PASSWORD: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: image-pull
  namespace: shopflow
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"USER","password":"TOKEN"}}}'